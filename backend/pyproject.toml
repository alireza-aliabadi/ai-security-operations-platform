[tool.poetry]
name = "aisoc-backend"
version = "0.1.0"
description = "AI Security Operations Platform — FastAPI backend"
authors = ["AISOC Team"]
readme = "README.md"
packages = [{ include = "aisoc", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.116.0"
uvicorn = { extras = ["standard"], version = "^0.35.0" }
pydantic = "^2.11.0"
pydantic-settings = "^2.10.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.41" }
psycopg = { extras = ["binary"], version = "^3.2.9" }
alembic = "^1.16.0"
httpx = "^0.28.1"
redis = "^6.2.0"
celery = { extras = ["redis"], version = "^5.5.0" }
langgraph = "^0.5.0"
langchain-core = "^0.3.0"
langchain-openai = "^0.3.0"
openai = "^1.93.0"
qdrant-client = "^1.14.0"
python-jose = { extras = ["cryptography"], version = "^3.5.0" }
argon2-cffi = "^25.1.0"
authlib = "^1.6.0"
itsdangerous = "^2.2.0"
cryptography = "^45.0.0"
slowapi = "^0.1.9"
prometheus-client = "^0.22.0"
opentelemetry-api = "^1.34.0"
opentelemetry-sdk = "^1.34.0"
opentelemetry-instrumentation-fastapi = "^0.55b0"
opentelemetry-instrumentation-httpx = "^0.55b0"
opentelemetry-instrumentation-sqlalchemy = "^0.55b0"
opentelemetry-exporter-otlp = "^1.34.0"
structlog = "^25.4.0"
python-multipart = "^0.0.20"
email-validator = "^2.2.0"
orjson = "^3.10.0"
tenacity = "^9.1.0"
sse-starlette = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "^1.0.0"
pytest-cov = "^6.2.0"
httpx = "^0.28.1"
ruff = "^0.12.0"
mypy = "^1.16.0"
types-python-jose = "^3.5.0"
aiosqlite = "^0.21.0"
factory-boy = "^3.3.0"

[tool.poetry.scripts]
aisoc = "aisoc.main:run"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.poetry]
name = "aisoc-mcp"
version = "0.1.0"
description = "MCP server for AI Security Operations Platform"
authors = ["AISOC Team"]
packages = [{ include = "aisoc_mcp", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
mcp = "^1.12.0"
httpx = "^0.28.1"
pydantic = "^2.11.0"
pydantic-settings = "^2.10.0"
structlog = "^25.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "^1.0.0"
ruff = "^0.12.0"

[tool.poetry.scripts]
aisoc-mcp = "aisoc_mcp.server:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

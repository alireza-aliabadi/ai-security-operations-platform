apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aisoc.fullname" . }}-secret
  labels:
    {{- include "aisoc.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  MCP_API_TOKEN: {{ .Values.secrets.mcpApiToken | quote }}
  LLM_PRIMARY_API_KEY: {{ .Values.secrets.llmPrimaryApiKey | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:%v/%s" .Values.postgres.username .Values.secrets.postgresPassword .Values.postgres.host .Values.postgres.port .Values.postgres.database | quote }}
  DATABASE_URL_SYNC: {{ printf "postgresql+psycopg://%s:%s@%s:%v/%s" .Values.postgres.username .Values.secrets.postgresPassword .Values.postgres.host .Values.postgres.port .Values.postgres.database | quote }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "aisoc.fullname" . }}-mcp
  labels:
    {{- include "aisoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: {{ .Values.mcp.service.type }}
  ports:
    - port: {{ .Values.mcp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "aisoc.mcp.selectorLabels" . | nindent 4 }}

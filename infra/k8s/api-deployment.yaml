apiVersion: apps/v1
kind: Deployment
metadata:
  name: aisoc-api
  namespace: aisoc
  labels:
    app: aisoc-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aisoc-api
  template:
    metadata:
      labels:
        app: aisoc-api
    spec:
      containers:
        - name: api
          image: ghcr.io/aisoc/api:0.1.0
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: APP_ENV
              value: production
            - name: CONNECTOR_MODE
              value: mock
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
